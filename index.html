<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Awal Kes Stroke - BE-FAST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D32F2F',
                        secondary: '#1976D2',
                        accent: '#388E3C',
                        neutral: '#F5F7FA',
                        dark: '#263238'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'sans-serif']
                    },
                    boxShadow: {
                        'glow': '0 4px 20px rgba(211, 47, 47, 0.25)',
                        'card': '0 8px 30px rgba(0,0,0,0.08)'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-focus {
                @apply focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all duration-200;
            }
            .btn-hover {
                @apply hover:scale-[1.02] active:scale-[0.98] transition-all duration-200;
            }
            .card-enter {
                animation: cardFade 0.5s ease-out forwards;
            }
            @keyframes cardFade {
                from { opacity: 0; transform: translateY(15px); }
                to { opacity: 1; transform: translateY(0); }
            }
            input[type="date"]::-webkit-calendar-picker-indicator,
            input[type="time"]::-webkit-calendar-picker-indicator {
                filter: invert(35%);
                cursor: pointer;
                padding-left: 0.5rem;
            }
        }
    </style>
</head>
<body class="bg-neutral min-h-screen font-sans text-dark">
    <div class="container mx-auto px-4 py-6 max-w-2xl">
        <!-- Header -->
        <header class="text-center mb-8 card-enter">
            <div class="inline-flex items-center justify-center bg-primary/10 text-primary rounded-full p-3 mb-3">
                <i class="fa fa-bell-o text-2xl"></i>
            </div>
            <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-primary">NOTIFIKASI AWAL KES STROKE</h1>
            <p class="text-lg font-semibold text-secondary mt-1">Sistem Laporan BE-FAST</p>
        </header>

        <!-- Borang Laporan -->
        <main class="bg-white rounded-2xl shadow-card p-6 mb-8 card-enter" style="animation-delay: 0.1s">
            <form id="reportForm" class="space-y-5">
                <!-- Maklumat Pesakit -->
                <section class="border-b border-gray-100 pb-5">
                    <h2 class="text-lg font-bold text-dark mb-4 flex items-center gap-2">
                        <i class="fa fa-user-circle text-secondary"></i> Maklumat Pesakit & Kejadian
                    </h2>
                    
                    <div class="space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Tarikh jumpa pesakit</label>
                                <input type="date" id="tarikh" 
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Masa jumpa pesakit</label>
                                <input type="time" id="masaJumpa" 
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none cursor-pointer">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama pesakit</label>
                            <input type="text" id="nama" placeholder="Nama penuh pesakit" 
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Umur</label>
                                <input type="text" id="umur" placeholder="Tahun" 
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Jantina</label>
                                <select id="jantina" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                                    <option value="">Pilih...</option>
                                    <option value="Lelaki">Lelaki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">No. Kad Pengenalan</label>
                            <input type="text" id="ic" placeholder="Contoh: 900101-10-xxxx" 
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi kejadian</label>
                            <input type="text" id="lokasi" placeholder="Alamat atau tempat kejadian" 
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                        </div>
                    </div>
                </section>

                <!-- BE-FAST Check -->
                <section class="border-b border-gray-100 pb-5">
                    <h2 class="text-lg font-bold text-dark mb-4 flex items-center gap-2">
                        <i class="fa fa-check-square-o text-primary"></i> Pemeriksaan BE-FAST
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- B -->
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <label class="block font-medium mb-2">B — Balance (Hilang keseimbangan / jatuh)</label>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="b" value="YA" class="accent-primary"> YA
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="b" value="TIDAK" class="accent-primary"> TIDAK
                                </label>
                            </div>
                        </div>
                        
                        <!-- E -->
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <label class="block font-medium mb-2">E — Eyes (Penglihatan kabur / berganda)</label>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="e" value="YA" class="accent-primary"> YA
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="e" value="TIDAK" class="accent-primary"> TIDAK
                                </label>
                            </div>
                        </div>
                        
                        <!-- F -->
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <label class="block font-medium mb-2">F — Face (Muka senget / tidak sekata)</label>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="f" value="YA" class="accent-primary"> YA
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="f" value="TIDAK" class="accent-primary"> TIDAK
                                </label>
                            </div>
                        </div>
                        
                        <!-- A -->
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <label class="block font-medium mb-2">A — Arms (Tangan lemah sebelah)</label>
                            <div class="flex flex-col gap-2">
                                <div class="flex gap-4">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="a" value="YA" class="accent-primary"> YA
                                    </label>
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="a" value="TIDAK" class="accent-primary"> TIDAK
                                    </label>
                                </div>
                                <div id="armSideGroup" class="hidden mt-2 pl-2 border-l-2 border-primary/30">
                                    <label class="text-sm font-medium text-gray-700">Sisi yang terjejas:</label>
                                    <div class="flex flex-wrap gap-4 mt-2">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="armSide" value="Kiri"> Kiri
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="armSide" value="Kanan"> Kanan
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="armSide" value="Kedua-dua belah"> Kedua-dua belah
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- S -->
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <label class="block font-medium mb-2">S — Speech (Bicara pelat / sukar bercakap)</label>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="s" value="YA" class="accent-primary"> YA
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="s" value="TIDAK" class="accent-primary"> TIDAK
                                </label>
                            </div>
                        </div>
                        
                        <!-- T -->
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <label class="block font-medium mb-2">T — Time (Masa simptom mula dikesan)</label>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1 block">Masa</label>
                                    <input type="time" id="masaSimptom" 
                                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none cursor-pointer">
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1 block">Tarikh</label>
                                    <input type="date" id="tarikhSimptom" 
                                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none cursor-pointer">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Tanda Vital -->
                <section class="border-b border-gray-100 pb-5">
                    <h2 class="text-lg font-bold text-dark mb-4 flex items-center gap-2">
                        <i class="fa fa-heartbeat text-accent"></i> Tanda Vital
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tekanan Darah (BP)</label>
                            <div class="flex items-center gap-2">
                                <input type="text" id="bpSistolik" placeholder="Sistolik" 
                                    class="flex-1 px-3 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                                <span>/</span>
                                <input type="text" id="bpDiastolik" placeholder="Diastolik" 
                                    class="flex-1 px-3 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                                <span class="text-sm text-gray-500">mmHg</span>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Gula Dalam Darah</label>
                            <div class="flex items-center gap-2">
                                <input type="text" id="gula" placeholder="Nilai" 
                                    class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                                <span class="text-sm text-gray-500">mmol/L</span>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Skor GCS</label>
                            <input type="text" id="gcs" placeholder="Contoh: 15/15" 
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ada makan ubat cair darah?</label>
                            <div class="flex gap-4 mt-2">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="ubatDarah" value="YA" class="accent-secondary"> YA
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="ubatDarah" value="TIDAK" class="accent-secondary"> TIDAK
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Lain-lain Tanda Vital -->
                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Lain-lain Tanda Vital</label>
                        <textarea id="vitalLain" rows="3" placeholder="Contoh: Nadi: 80/min, Suhu: 37°C, Pernafasan: 20/min, Keadaan Umum: Sedang..." 
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none resize-none"></textarea>
                    </div>
                </section>

                <!-- Maklumat Penghantaran -->
                <section class="pb-2">
                    <h2 class="text-lg font-bold text-dark mb-4 flex items-center gap-2">
                        <i class="fa fa-ambulance text-secondary"></i> Maklumat Rujukan & Responder
                    </h2>
                    
                    <div class="space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Anggaran masa tiba (ETA) ke Hospital</label>
                                <div class="flex items-center gap-2">
                                    <input type="text" id="eta" placeholder="Masa" 
                                        class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                                    <span class="text-sm text-gray-500">minit</span>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Hospital dituju</label>
                                <select id="hospitalPilih" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                                    <option value="">Pilih Hospital...</option>
                                    <option value="HTAR">HTAR</option>
                                    <option value="BANTING">BANTING</option>
                                    <option value="HSAS">HSAS</option>
                                    <option value="HASA">HASA</option>
                                    <option value="OTHER">LAIN-LAIN</option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- Input Manual Hospital Lain -->
                        <div id="hospitalLainGroup" class="hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Hospital Lain</label>
                            <input type="text" id="hospitalLain" placeholder="Masukkan nama hospital..." 
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Responder</label>
                                <input type="text" id="namaResponder" placeholder="Nama anda" 
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">No. Telefon Responder</label>
                                <input type="text" id="telResponder" placeholder="Contoh: 012-3456789" 
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg input-focus outline-none">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Butang Tindakan -->
                <div class="pt-4 space-y-3">
                    <button type="button" id="generateBtn" 
                        class="w-full bg-secondary hover:bg-secondary/90 text-white font-bold py-3 px-6 rounded-lg shadow-lg btn-hover flex items-center justify-center gap-2">
                        <i class="fa fa-file-text-o"></i> Jana Laporan
                    </button>
                    
                    <button type="button" id="sendBtn" disabled
                        class="w-full bg-accent hover:bg-accent/90 text-white font-bold py-3 px-6 rounded-lg shadow-lg btn-hover flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa fa-whatsapp"></i> Hantar ke WhatsApp
                    </button>
                    
                    <button type="reset" 
                        class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2.5 px-6 rounded-lg btn-hover">
                        <i class="fa fa-refresh"></i> Kosongkan Borang
                    </button>
                </div>
            </form>
        </main>

        <!-- Pratonton Laporan -->
        <section id="previewSection" class="hidden bg-white rounded-2xl shadow-card p-6 mb-8 card-enter">
            <h2 class="text-lg font-bold text-dark mb-4 flex items-center gap-2 text-primary">
                <i class="fa fa-eye"></i> Pratonton Laporan
            </h2>
            <div id="reportPreview" class="whitespace-pre-wrap bg-gray-50 p-4 rounded-lg border text-sm leading-relaxed"></div>
        </section>

        <!-- Footer -->
        <footer class="text-center text-sm text-gray-500 mt-8">
            <p>Sistem Laporan Awal Kes Stroke — Protokol BE-FAST</p>
        </footer>
    </div>

    <script>
        // Tunjuk/sembunyikan pilihan sisi tangan bila A = YA
        document.querySelectorAll('input[name="a"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const armGroup = document.getElementById('armSideGroup');
                armGroup.classList.toggle('hidden', this.value !== 'YA');
            });
        });

        // Tunjuk/sembunyikan input nama hospital lain
        document.getElementById('hospitalPilih').addEventListener('change', function() {
            const hospitalLainGroup = document.getElementById('hospitalLainGroup');
            hospitalLainGroup.classList.toggle('hidden', this.value !== 'OTHER');
        });

        // Fungsi format tarikh ke format mudah dibaca
        function formatTarikh(inputTarikh) {
            if (!inputTarikh) return '';
            const tarikh = new Date(inputTarikh + 'T00:00:00');
            return tarikh.toLocaleDateString('ms-MY', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric' 
            });
        }

        // Fungsi format masa + tambah label pagi/tengah hari/petang/malam
        function formatMasa(inputMasa) {
            if (!inputMasa) return '';
            const [jam, minit] = inputMasa.split(':');
            const jamNum = parseInt(jam);
            let label = 'Pagi';
            if (jamNum >= 12 && jamNum < 13) label = 'Tengah Hari';
            else if (jamNum >= 13 && jamNum < 19) label = 'Petang';
            else if (jamNum >= 19 || jamNum < 6) label = 'Malam';
            return `${jam}:${minit} ${label}`;
        }

        let reportText = '';

        // Fungsi jana laporan
        document.getElementById('generateBtn').addEventListener('click', function() {
            const getVal = (id) => document.getElementById(id)?.value?.trim() || '';
            const getRadio = (name) => {
                const el = document.querySelector(`input[name="${name}"]:checked`);
                return el ? el.value : '';
            };

            // Kumpul semua nilai
            const tarikh = getVal('tarikh');
            const masaJumpa = getVal('masaJumpa');
            const tarikhMasaJumpa = (formatTarikh(tarikh) || '__/__/____') + ' — ' + (formatMasa(masaJumpa) || '__:__');
            
            const nama = getVal('nama');
            const umur = getVal('umur');
            const jantina = getVal('jantina');
            const ic = getVal('ic');
            const lokasi = getVal('lokasi');
            
            const b = getRadio('b');
            const e = getRadio('e');
            const f = getRadio('f');
            const a = getRadio('a');
            const armSide = getRadio('armSide');
            const s = getRadio('s');
            
            const masaSimptom = getVal('masaSimptom');
            const tarikhSimptom = getVal('tarikhSimptom');
            let masaSimptomFormat = '';
            if (masaSimptom || tarikhSimptom) {
                masaSimptomFormat = formatTarikh(tarikhSimptom) || '';
                if (masaSimptomFormat && formatMasa(masaSimptom)) masaSimptomFormat += ' — ';
                masaSimptomFormat += formatMasa(masaSimptom) || '';
            }
            if (!masaSimptomFormat) masaSimptomFormat = '__:__';
            
            const bpSistolik = getVal('bpSistolik');
            const bpDiastolik = getVal('bpDiastolik');
            const gula = getVal('gula');
            const gcs = getVal('gcs');
            const ubatDarah = getRadio('ubatDarah');
            const vitalLain = getVal('vitalLain');
            
            // Dapatkan nama hospital
            let hospital = getVal('hospitalPilih');
            if (hospital === 'OTHER') {
                hospital = getVal('hospitalLain') || 'Lain-lain';
            }
            
            const eta = getVal('eta');
            const namaResponder = getVal('namaResponder');
            const telResponder = getVal('telResponder');

            // Bentuk teks laporan
            reportText = `🚨 NOTIFIKASI AWAL KES STROKE - BE-FAST 🚨

Tarikh / Masa jumpa pesakit: ${tarikhMasaJumpa}
Nama pesakit: ${nama || '_'}
Umur / Jantina: ${umur || '_'} / ${jantina || '_'}
No IC: ${ic || '_'}
Lokasi kejadian: ${lokasi || '_'}

BE-FAST CHECK:

B - Balance (Hilang keseimbangan / jatuh) : ${b || '_'}
E - Eyes (Kabur / double vision) : ${e || '_'}
F - Face (Muka senget) : ${f || '_'}
A - Arms (Tangan lemah sebelah) : ${a || '_'}${a === 'YA' ? ` — ${armSide || '_'}` : ''}
S - Speech (Cakap pelat) : ${s || '_'}
T - Time (Masa simptom mula) : ${masaSimptomFormat || '__:__'}

Tanda Vital (jika ada):
BP: ${bpSistolik || '_'} / ${bpDiastolik || '_'} mmHg
Gula: ${gula || '_'} mmol
GCS: ${gcs || '_'}
${vitalLain ? `Lain-lain: ${vitalLain}` : ''}

Pesakit ada makan ubat cair darah? ${ubatDarah || '_'}

ETA ke Hospital: ${eta || '_'} minit
Hospital dituju: ${hospital || '_'}

Nama Responder: ${namaResponder || '_'}
No tel responder: ${telResponder || '_'}`;

            // Paparkan pratonton
            document.getElementById('reportPreview').textContent = reportText;
            document.getElementById('previewSection').classList.remove('hidden');
            document.getElementById('sendBtn').disabled = false;
            
            // Tatal ke pratonton
            document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });
        });

        // Fungsi hantar ke WhatsApp
        document.getElementById('sendBtn').addEventListener('click', function() {
            if (!reportText) return;
            
            // Tukar ke format URL WhatsApp
            const encodedText = encodeURIComponent(reportText);
            const waUrl = `https://wa.me/?text=${encodedText}`;
            
            // Buka dalam tab baharu
            window.open(waUrl, '_blank');
        });

        // Kosongkan borang semula
        document.getElementById('reportForm').addEventListener('reset', function() {
            reportText = '';
            setTimeout(() => {
                document.getElementById('previewSection').classList.add('hidden');
                document.getElementById('sendBtn').disabled = true;
                document.getElementById('armSideGroup').classList.add('hidden');
                document.getElementById('hospitalLainGroup').classList.add('hidden');
            }, 100);
        });
    </script>
</body>
</html>
